pre-commit:
    parallel: false
    commands:
        validate-examples:
            glob:
                - "*.php"
            run: |
                cd examples && for file in *.php; do
                  echo "Testing examples/$file..."
                  php "$file" > /dev/null 2>&1 || { echo "✗ Failed: examples/$file"; exit 1; }
                  echo "✓ Passed: examples/$file"
                done

        sync-readme-examples:
            glob:
                - "*.php"
                - "*.md"
            run: vendor/bin/readme-examples-sync
            stage_fixed: true

        composer-validate:
            glob:
                - "composer.json"
                - "composer.lock"
            run: composer validate --strict

        composer-normalize:
            glob: "composer.json"
            run: composer normalize --diff
            stage_fixed: true

        composer-dependency-analyser:
            glob:
                - "*.php"
                - "composer.json"
                - "composer.lock"
            run: vendor/bin/composer-dependency-analyser

        mago-fmt:
            glob: "*.php"
            run: vendor/bin/mago fmt -- {staged_files}
            stage_fixed: true

        twig-cs-fixer:
            glob: "*.twig"
            run: vendor/bin/twig-cs-fixer fix -- {staged_files}
            stage_fixed: true

        mago-lint:
            glob:
                - "*.php"
                - "mago.toml"
            run: vendor/bin/mago lint --minimum-fail-level=warning

        mago-analyze:
            glob:
                - "*.php"
                - "mago.toml"
            run: vendor/bin/mago analyze --minimum-fail-level=warning

        phpunit:
            glob: "*.php"
            run: vendor/bin/phpunit
